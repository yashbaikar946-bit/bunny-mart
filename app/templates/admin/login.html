{% extends "admin/base.html" %}

{% block title %}Admin Login - Bunny Mart{% endblock %}

{% block content %}

<div class="admin-login-page">

    <div class="admin-login-card">

        <h1>🐟 Admin Login</h1>

        <p class="admin-login-subtitle">
            Welcome to Bunny Mart Admin Panel
        </p>

        <form method="post">

            <label>Username</label>
            <input
                type="text"
                name="username"
                placeholder="Enter admin username"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <div class="admin-forgot">
            <a href="{{ url_for('admin.forgot_password') }}">
                Forgot Password?
            </a>
        </div>

    </div>

</div>

{% endblock %}
