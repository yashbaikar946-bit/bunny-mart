{% extends "admin/base.html" %}

{% block title %}Admin Forgot Password - Bunny Mart{% endblock %}

{% block content %}

<div class="admin-forgot-page">

    <div class="admin-forgot-bg">
        <span class="forgot-bubble bubble-a"></span>
        <span class="forgot-bubble bubble-b"></span>
        <span class="forgot-bubble bubble-c"></span>
        <span class="forgot-bubble bubble-d"></span>
    </div>

    <div class="admin-forgot-card">

        <div class="forgot-icon">
            🔐
        </div>

        <div class="forgot-eyebrow">
            BUNNY MART SECURITY
        </div>

        <h1>Forgot Password?</h1>

        <p class="forgot-subtitle">
            Reset your admin account password securely.
        </p>

        <form method="post" class="admin-forgot-form">

            <div class="forgot-field">

                <label>Admin Username</label>

                <div class="forgot-input-wrap">
                    <span>👤</span>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter admin username"
                        required
                    >
                </div>

            </div>


            <div class="forgot-field">

                <label>New Password</label>

                <div class="forgot-input-wrap">
                    <span>🔑</span>

                    <input
                        type="password"
                        name="new_password"
                        placeholder="Create new password"
                        minlength="6"
                        required
                    >
                </div>

            </div>


            <div class="forgot-field">

                <label>Confirm New Password</label>

                <div class="forgot-input-wrap">
                    <span>🛡️</span>

                    <input
                        type="password"
                        name="confirm_password"
                        placeholder="Confirm new password"
                        minlength="6"
                        required
                    >
                </div>

            </div>


            <button type="submit" class="admin-reset-btn">
                <span>🔐</span>
                Change Password
                <span class="btn-arrow">→</span>
            </button>

        </form>


        <div class="forgot-divider">
            <span>OR</span>
        </div>


        <a
            href="{{ url_for('admin.login') }}"
            class="admin-back-login"
        >
            <span>←</span>
            Back to Admin Login
        </a>


        <div class="forgot-security-note">
            🐠 Your Bunny Mart admin account is protected
        </div>

    </div>

</div>

{% endblock %}
