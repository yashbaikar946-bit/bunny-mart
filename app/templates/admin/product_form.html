{% extends "admin/base.html" %}{% block title %}{{ 'Edit' if product else 'Add' }} product{% endblock %}
{% block content %}
<h1>{{ 'Edit' if product else 'Add' }} product</h1>
<form method="post" enctype="multipart/form-data" class="card" style="max-width:520px">
  <label>Name</label><input name="name" value="{{ product.name if product else '' }}" required>
  <label>Category</label>
  <select name="category_id"><option value="">Uncategorised</option>
    {% for c in categories %}
    <option value="{{ c.category_id }}" {% if product and product.category_id==c.category_id %}selected{% endif %}>{{ c.name }}</option>
    {% endfor %}
  </select>
  <label>Description</label><textarea name="description" rows="4">{{ product.description if product else '' }}</textarea>
  <label>Price</label><input type="number" step="0.01" min="0" name="price" value="{{ product.price if product else '0' }}">
  <label>Stock</label><input type="number" min="0" name="stock" value="{{ product.stock if product else '0' }}">
  <label>Image</label><input type="file" name="image" accept="image/*">
  <p><button type="submit">Save product</button></p>
</form>
{% endblock %}
