<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Login - Bunny Mart</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="login-page">

    <!-- Animated Aquarium Background -->
    <div class="login-ocean">

        <span class="login-bubble bubble-a"></span>
        <span class="login-bubble bubble-b"></span>
        <span class="login-bubble bubble-c"></span>
        <span class="login-bubble bubble-d"></span>
        <span class="login-bubble bubble-e"></span>

        <div class="login-fish fish-a">🐠</div>
        <div class="login-fish fish-b">🐟</div>
        <div class="login-fish fish-c">🐡</div>

        <div class="water-light light-a"></div>
        <div class="water-light light-b"></div>

    </div>


    <!-- Login Area -->
    <div class="login-container">

        <div class="login-card">

            <!-- Logo -->
            <div class="login-logo-wrap">

                <div class="login-logo">
                    🐠
                </div>

                <div class="logo-ring"></div>

            </div>


            <div class="login-brand">
                <span>BUNNY</span> MART
            </div>

            <p class="login-subtitle">
                Welcome back! Dive into your aquarium world.
            </p>


            <div class="login-title-line">
                <span></span>
                <h2>Customer Login</h2>
                <span></span>
            </div>


            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}

                {% for category, message in messages %}

                    <div class="login-message {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endwith %}


            <!-- Login Form -->
            <form method="POST" class="login-form">

                <div class="login-field">

                    <label>
                        📧 Email Address
                    </label>

                    <div class="login-input-wrap">

                        <span class="input-icon">✉️</span>

                        <input
                            type="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <div class="login-field">

                    <label>
                        🔐 Password
                    </label>

                    <div class="login-input-wrap">

                        <span class="input-icon">🔑</span>

                        <input
                            type="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                </div>


                <button type="submit" class="login-btn">

                    <span class="login-btn-icon">🌊</span>

                    <span>LOGIN TO BUNNY MART</span>

                    <span class="login-arrow">→</span>

                </button>

            </form>


            <!-- Forgot Password -->
            <div class="forgot-password">

                <a href="{{ url_for('auth.forgot_password') }}">
                    Forgot Password?
                </a>

            </div>


            <!-- Register -->
            <div class="register-box">

                <span>New to Bunny Mart?</span>

                <a href="{{ url_for('auth.register') }}">
                    Create Account →
                </a>

            </div>


            <!-- Bottom Decoration -->
            <div class="login-footer">

                <span>🐚</span>
                <span>🐠</span>
                <span>🪸</span>
                <span>🐟</span>
                <span>🐚</span>

            </div>

        </div>

    </div>

</body>
</html>
