{% extends "base.html" %}

{% block title %}Change Password - Bunny Mart{% endblock %}

{% block content %}

<div class="password-page">

    <div class="password-card">

        <div class="password-icon">
            🔐
        </div>

        <h1>Change Password</h1>

        <p class="password-subtitle">
            Keep your Bunny Mart account secure.
        </p>

        <form method="post">

            <div class="form-group">
                <label>Current Password</label>

                <input
                    type="password"
                    name="current_password"
                    placeholder="Enter current password"
                    required
                >
            </div>

            <div class="form-group">
                <label>New Password</label>

                <input
                    type="password"
                    name="new_password"
                    placeholder="Enter new password"
                    minlength="6"
                    required
                >
            </div>

            <div class="form-group">
                <label>Confirm New Password</label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    minlength="6"
                    required
                >
            </div>

            <button type="submit" class="password-btn">
                🔒 Update Password
            </button>

        </form>

        <a
            href="{{ url_for('profile.view') }}"
            class="back-profile"
        >
            ← Back to Profile
        </a>

    </div>

</div>

{% endblock %}
